<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Email Fastkart</title>
    <style>
        body {
            margin: 0; padding: 20px;
            background-color: #f2f2f2;
            font-family: 'Nunito Sans', sans-serif;
            text-align: center;
        }
        h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .verify-button {
            display: inline-block;
            background-color: #0DA487;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 26px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<h2>Xin chào {{username}}</h2>
<p>Vui lòng kích hoạt tài khoản để tiếp tục truy cập!</p>
<a href="{{verifyUrl}}" class="verify-button">Xác thực tài khoản</a>
</body>
</html>

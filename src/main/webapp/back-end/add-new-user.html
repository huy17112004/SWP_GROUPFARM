            <!-- Page Sidebar Start -->
            <div class="page-body">
                <!-- New User start -->
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12">
                            <div class="row">
                                <div class="col-sm-8 m-auto">
                                    <div class="card">
                                        <div class="card-body">
                                            <div class="title-header option-title">
                                                <h5>Add New User</h5>
                                            </div>
                                            <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                                                <li class="nav-item" role="presentation">
                                                    <button class="nav-link active" id="pills-home-tab"
                                                        data-bs-toggle="pill" data-bs-target="#pills-home"
                                                        type="button">Account</button>
                                                </li>
                                            </ul>

                                            <div class="tab-content" id="pills-tabContent">
                                                <div class="tab-pane fade show active" id="pills-home" role="tabpanel">
                                                    <form class="theme-form theme-form-2 mega-form" id="addUserForm">
                                                        <div class="card-header-1">
                                                            <h5>Product Information</h5>
                                                        </div>

                                                        <div class="row">
                                                            <div class="mb-4 row align-items-center">
                                                                <label
                                                                    class="form-label-title col-lg-2 col-md-3 mb-0">User Name</label>
                                                                <div class="col-md-9 col-lg-10">
                                                                    <input class="form-control" type="text" name="username" required placeholder="Username">
                                                                </div>
                                                            </div>

                                                            <div class="mb-4 row align-items-center">
                                                                <label
                                                                    class="col-lg-2 col-md-3 col-form-label form-label-title">Email
                                                                    Address</label>
                                                                <div class="col-md-9 col-lg-10">
                                                                    <input class="form-control" type="email" name="email" required placeholder="Email">
                                                                </div>
                                                            </div>

                                                            <div class="mb-4 row align-items-center">
                                                                <label
                                                                    class="col-lg-2 col-md-3 col-form-label form-label-title">Password</label>
                                                                <div class="col-md-9 col-lg-10">
                                                                    <input class="form-control" type="password" name="password" required placeholder="Password">
                                                                </div>
                                                            </div>

                                                            <div class="row align-items-center">
                                                                <label
                                                                    class="col-lg-2 col-md-3 col-form-label form-label-title">Confirm
                                                                    Password</label>
                                                                <div class="col-md-9 col-lg-10">
                                                                    <input class="form-control" type="password" required placeholder="Confirm Password">
                                                                </div>
                                                            </div>

                                                            <div class="row align-items-center">
                                                                <label
                                                                    class="col-lg-2 col-md-3 col-form-label form-label-title">Role</label>
                                                                <div class="col-md-9 col-lg-10">
                                                                    <select class="form-control" name="role" required>
                                                                        <option value="">--Chọn loại user--</option>
                                                                        <option value="ADMIN">Admin</option>
                                                                        <option value="SALER">Saler</option>
                                                                        <option value="SHIPPER">Shipper</option>
                                                                        <option value="MANAGER">Manager</option>
                                                                        <option value="WAREHOUSE_STAFF">Warehouse Staff</option>
                                                                        <option value="WAREHOUSE_MANAGER">Warehouse Manager</option>
                                                                        <option value="WHOLESALE_CUSTOMER">Wholesale Customer</option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <div class="row">
                                                            <div class="col-12 d-flex justify-content-center">
                                                                <button type="submit" class="btn btn-primary mt-3" style="min-width: 180px;">
                                                                    Tạo tài khoản
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </form>
                                                </div>

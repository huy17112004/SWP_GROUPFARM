    <script>
    const API_DEST = '/stock-transfers/destination-warehouse';
    const API_SRC = '/stock-transfers/source-warehouse';
    let currentTab = 'import';
    
    function formatDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        return d.toLocaleString('vi-VN');
    }

    function translateStatus(status) {
        switch (status) {
            case 'PENDING': return '<span class="badge-status badge-pending">Chờ xử lý</span>';
            case 'DELIVERING': return '<span class="badge-status badge-delivering">Đang vận chuyển</span>';
            case 'COMPLETED': return '<span class="badge-status badge-completed">Đã hoàn thành</span>';
            case 'CANCELLED': return '<span class="badge-status badge-cancelled">Đã hủy</span>';
            default: return status;
        }
    }

    function renderTable(data) {
        const tbody = document.querySelector('#stockTransferTable tbody');
        const thead = document.querySelector('#stockTransferTable thead tr');
        // Render lại header theo tab
        if (currentTab === 'import') {
            thead.innerHTML = `
                <th>Mã phiếu</th>
                <th>Kho nguồn</th>
                <th>Trạng thái</th>
                <th>Ngày yêu cầu</th>
                <th style='width:36px; text-align:center;'>Chức năng</th>
            `;
        } else {
            thead.innerHTML = `
                <th>Mã phiếu</th>
                <th>Kho đích</th>
                <th>Trạng thái</th>
                <th>Ngày yêu cầu</th>
                <th style='width:36px; text-align:center;'>Chức năng</th>
            `;
        }
        tbody.innerHTML = '';
        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center">Không có dữ liệu</td></tr>`;
            return;
        }
        data.forEach(item => {
            let rowHtml = '';
            if (currentTab === 'import') {
                rowHtml = `
                    <td>${item.stockTransferId}</td>
                    <td>${item.sourceWarehouseName}</td>
                    <td>${translateStatus(item.status)}</td>
                    <td>${formatDate(item.requestedAt)}</td>
                    <td style='text-align:center;'><i class='fa fa-eye text-info' style='font-size:15px;'></i></td>
                `;
            } else {
                rowHtml = `
                    <td>${item.stockTransferId}</td>
                    <td>${item.destinationWarehouseName}</td>
                    <td>${translateStatus(item.status)}</td>
                    <td>${formatDate(item.requestedAt)}</td>
                    <td style='text-align:center;'><i class='fa fa-eye text-info' style='font-size:15px;'></i></td>
                `;
            }
            const tr = document.createElement('tr');
            tr.innerHTML = rowHtml;
            tr.style.cursor = 'pointer';
            tr.addEventListener('click', function(e) {
                showDetail(JSON.stringify(item));
            });
            tbody.appendChild(tr);
        });
    }

    function showDetail(itemStr) {
        const item = JSON.parse(itemStr);
        let html = `<div class="row">`;
        if (currentTab === 'import') {
            html += `
                <div class="col-md-6">
                    <strong>Mã phiếu:</strong> ${item.stockTransferId}<br>
                    <strong>Đơn hàng:</strong> ${item.orderId}<br>
                    <strong>Kho nguồn:</strong> ${item.sourceWarehouseName}<br>
                    <strong>Địa chỉ kho nguồn:</strong> ${item.sourceWarehouseAddress}<br>
                </div>
                <div class="col-md-6">
                    <strong>Trạng thái:</strong> ${translateStatus(item.status)}<br>
                    <strong>Ngày yêu cầu:</strong> ${formatDate(item.requestedAt)}<br>
                </div>
            `;
        } else {
            html += `
                <div class="col-md-6">
                    <strong>Mã phiếu:</strong> ${item.stockTransferId}<br>
                    <strong>Đơn hàng:</strong> ${item.orderId}<br>
                    <strong>Kho đích:</strong> ${item.destinationWarehouseName}<br>
                    <strong>Địa chỉ kho đích:</strong> ${item.destinationWarehouseAddress}<br>
                </div>
                <div class="col-md-6">
                    <strong>Trạng thái:</strong> ${translateStatus(item.status)}<br>
                    <strong>Ngày yêu cầu:</strong> ${formatDate(item.requestedAt)}<br>
                </div>
            `;
        }
        html += `</div>
        <hr>
        <h6>Danh sách sản phẩm chuyển kho:</h6>
        <div class="table-responsive">
        <table class="table table-bordered">
            <thead><tr><th>Mã lô</th><th>Tên sản phẩm</th><th>Số lượng</th></tr></thead>
            <tbody>
                ${(item.stockTransferItems||[]).map(it => `
                    <tr>
                        <td>${it.stockLotId}</td>
                        <td>${it.productName}</td>
                        <td>${it.quantity}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
        </div>`;
        document.getElementById('modalDetailContent').innerHTML = html;

        // Xử lý nút động trong modal-footer
        const modalFooter = document.querySelector('#detailModal .modal-footer');
        let actionBtnHtml = '';
        if (currentTab === 'export' && item.status === 'PENDING') {
            actionBtnHtml = `<button type="button" class="btn btn-success" id="confirmExportBtn">Xác nhận xuất kho</button>`;
        } else if (currentTab === 'import' && item.status === 'DELIVERING') {
            actionBtnHtml = `<button type="button" class="btn btn-success" id="confirmImportBtn">Kiểm hàng thành công</button>`;
        }
        modalFooter.innerHTML = actionBtnHtml;

        if (currentTab === 'export' && item.status === 'PENDING') {
            document.getElementById('confirmExportBtn').onclick = async function() {
                if (!window.confirm('Bạn có chắc chắn muốn xuất kho không?')) return;
                try {
                    const res = await fetch(`/stock-transfers/export?id=${item.stockTransferId}`, { method: 'POST' });
                    if (!res.ok) throw new Error('Lỗi khi xác nhận xuất kho');
                    const data = await res.json();
                    if (data && (data.success === undefined || data.success)) {
                        alert('Xác nhận xuất kho thành công!');
                        bootstrap.Modal.getInstance(document.getElementById('detailModal')).hide();
                        fetchData('export');
                    } else {
                        alert(data.message || 'Có lỗi xảy ra!');
                    }
                } catch (e) {
                    alert('Có lỗi xảy ra khi xác nhận xuất kho!');
                }
            };
        } else if (currentTab === 'import' && item.status === 'DELIVERING') {
            document.getElementById('confirmImportBtn').onclick = async function() {
                if (!window.confirm('Bạn có chắc chắn đã kiểm hàng thành công không?')) return;
                try {
                    const res = await fetch(`/stock-transfers/complete?id=${item.stockTransferId}`, { method: 'POST' });
                    if (!res.ok) throw new Error('Lỗi khi xác nhận kiểm hàng thành công');
                    const data = await res.json();
                    if (data && (data.success === undefined || data.success)) {
                        alert('Xác nhận kiểm hàng thành công!');
                        bootstrap.Modal.getInstance(document.getElementById('detailModal')).hide();
                        fetchData('import');
                    } else {
                        alert(data.message || 'Có lỗi xảy ra!');
                    }
                } catch (e) {
                    alert('Có lỗi xảy ra khi xác nhận kiểm hàng thành công!');
                }
            };
        }
        const modal = new bootstrap.Modal(document.getElementById('detailModal'));
        modal.show();
    }

    async function fetchData(tab) {
        let url = tab === 'import' ? API_DEST : API_SRC;
        url += '?status=PENDING,DELIVERING';
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Lỗi khi lấy dữ liệu');
            const data = await res.json();
            renderTable(data);
        } catch (e) {
            renderTable([]);
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('import-tab').addEventListener('click', function() {
            currentTab = 'import';
            this.classList.add('active');
            document.getElementById('export-tab').classList.remove('active');
            fetchData('import');
        });
        document.getElementById('export-tab').addEventListener('click', function() {
            currentTab = 'export';
            this.classList.add('active');
            document.getElementById('import-tab').classList.remove('active');
            fetchData('export');
        });
        fetchData('import'); // Mặc định load nhập kho
    });
    </script>

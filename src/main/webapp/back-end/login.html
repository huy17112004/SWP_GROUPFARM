<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Cuba admin is super flexible, powerful, clean &amp; modern responsive bootstrap 5 admin template with unlimited possibilities.">
    <meta name="keywords"
        content="admin template, Cuba admin template, dashboard template, flat admin template, responsive admin template, web app">
    <meta name="author" content="pixelstrap">
    <link rel="icon" href="assets/images/favicon.png" type="image/x-icon">
    <link rel="shortcut icon" href="assets/images/favicon.png" type="image/x-icon">
    <title>Fastkart - log In</title>

    <!-- Google font-->
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- Bootstrap css -->
    <link rel="stylesheet" type="text/css" href="assets/css/vendors/bootstrap.css">

    <!-- App css -->
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
</head>

<body>

    <!-- login section start -->
    <section class="log-in-section section-b-space">
        <a href="" class="logo-login">
            <img src="assets/images/logo/1.png" class="img-fluid" alt="Logo">
        </a>
        <div class="container w-100">
            <div class="row">
                <div class="col-xl-5 col-lg-6 me-auto">
                    <div class="log-in-box">
                        <div class="log-in-title">
                            <h3>Chào mừng đến với Fastkart</h3>
                            <h4>Đăng nhập tài khoản của bạn</h4>
                        </div>
                        <div class="input-box">
                            <form id="roleLoginForm" class="row g-4">
                                <!-- vùng hiển thị alert -->
                                <div id="alertContainer"></div>

                                <div class="col-12">
                                    <div class="form-floating theme-form-floating log-in-form">
                                        <input type="text" class="form-control" id="username"
                                            placeholder="Username/Email">
                                        <label for="username">nhập tài khoản</label>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="form-floating theme-form-floating log-in-form">
                                        <input type="password" class="form-control" id="password"
                                            placeholder="Password">
                                        <label for="password">Mật khẩu</label>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="form-floating theme-form-floating log-in-form">
                                        <select class="form-select" id="roleSelect">
                                            <option value="SELLER">Nhân viên Sale</option>
                                            <option value="MANAGER">Quản Lí</option>
                                            <option value="WAREHOUSE">Nhân Viên Kho</option>
                                            <option value="SHIPPER">Giao Hàng</option>
                                        </select>
                                        <label for="roleSelect">Chọn Vai Trò</label>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="form-check ps-0 m-0 remember-box">
                                        <input class="checkbox_animated check-box" type="checkbox" id="rememberMe">
                                        <label class="form-check-label" for="rememberMe">Lưu phiên đăng nhập</label>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <button type="submit" class="btn btn-animation w-100 justify-content-center">
                                        Đăng Nhập</button>
                                </div>

                                <div class="sign-up-box">
                                    <a href="../front-end/login.html">Đăng nhập với vai trò khách hàng?</a>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- login section end -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('roleLoginForm');
            const alertContainer = document.getElementById('alertContainer');

            form.addEventListener('submit', async e => {
                e.preventDefault();
                alertContainer.innerHTML = '';

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const role = document.getElementById('roleSelect').value;
                const rememberMe = document.getElementById('rememberMe').checked;

                // Validate cơ bản
                if (!username || !password) {
                    return showAlert('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.', 'danger');
                }

                try {
                    const resp = await fetch('http://localhost:8080/role-signin', {
                        method: 'POST',
                        mode: 'cors',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, role, rememberMe })
                    });
                    const data = await resp.json();

                    if (resp.ok) {
                        // chuyển trang dựa vào redirectUrl server trả về
                        window.location.href = data.redirectUrl;
                    } else {
                        showAlert(data.error || 'Đăng nhập thất bại.', 'danger');
                    }
                } catch (err) {
                    console.error(err);
                    showAlert('Không thể kết nối đến server.', 'danger');
                }
            });

            function showAlert(msg, type = 'info') {
                alertContainer.innerHTML = `<div class="alert alert-${type} mt-2">${msg}</div>`;
            }
        });
    </script>

</body>

</html>

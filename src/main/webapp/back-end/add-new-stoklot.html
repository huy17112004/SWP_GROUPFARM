    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const apiStockLot = 'http://localhost:8080/api/stocklots';
            const apiProducts = 'http://localhost:8080/api/product';
            const apiWarehouses = 'http://localhost:8080/api/warehouses-detail';

            // 1) Load sản phẩm
            fetch(apiProducts)
                .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(products => {
                    const sel = document.getElementById('productSelect');
                    products.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.productId ?? p.id;
                        opt.textContent = p.productName ?? p.name;
                        sel.appendChild(opt);
                    });
                })
                .catch(console.error);

            // 2) Load kho
            fetch(apiWarehouses)
                .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(warehouses => {
                    const sel = document.getElementById('warehouseSelect');
                    warehouses.forEach(w => {
                        const opt = document.createElement('option');
                        opt.value = w.warehouseId ?? w.id;
                        opt.textContent = w.warehouseName ?? w.name;
                        sel.appendChild(opt);
                    });
                })
                .catch(console.error);

            // 3) Helper: ép có giây và chuyển sang ISO-8601 với Z
            function toIsoString(raw) {
                // raw = "YYYY-MM-DDThh:mm" hoặc "YYYY-MM-DDThh:mm:ss"
                let v = raw;
                if (v.length === 16) v += ':00';        // thêm ":00" nếu chỉ tới phút
                return new Date(v).toISOString();      // => "2025-07-16T05:15:00.000Z"
            }

            // 4) Submit form
            document.getElementById('importLotForm').addEventListener('submit', e => {
                e.preventDefault();

                const productId = document.getElementById('productSelect').value;
                const warehouseId = document.getElementById('warehouseSelect').value;
                const quantity = document.getElementById('qtyInput').value;
                const importRaw = document.getElementById('importDateInput').value;
                const expiredRaw = document.getElementById('expiredDateInput').value;

                if (!productId || !warehouseId || !quantity || !importRaw || !expiredRaw) {
                    return alert('Vui lòng điền đầy đủ thông tin!');
                }

                const lot = {
                    productId: Number(productId),
                    warehouseId: Number(warehouseId),
                    quantity: Number(quantity),
                    importDate: toIsoString(importRaw),
                    expiredDate: toIsoString(expiredRaw)
                };

                fetch(apiStockLot, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(lot)
                })
                    .then(async res => {
                        const text = await res.text();
                        if (!res.ok) {
                            console.error('Server 500 response:', text);
                            throw new Error(`HTTP ${res.status}: ${text}`);
                        }
                        return JSON.parse(text);
                    })
                    .then(data => {
                        alert('Thêm lô hàng thành công!');
                        document.getElementById('importLotForm').reset();
                    })
                    .catch(err => {
                        console.error('Create stocklot failed:', err);
                        alert('Lỗi khi thêm lô hàng:\n' + err.message);
                    });
            });
        });
    </script>

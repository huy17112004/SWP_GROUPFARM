<!DOCTYPE html>
<html lang="en" dir="ltr">

<body>
    <!-- tap on top start -->
    <div class="tap-top">
        <span class="lnr lnr-chevron-up"></span>
    </div>
    <!-- tap on tap end -->

    <!-- page-wrapper Start -->
    <div class="page-wrapper compact-wrapper" id="pageWrapper">
        <!-- Page Header Start -->
        <div class="page-header">
            <div class="header-wrapper m-0">
                <div class="header-logo-wrapper p-0">
                    <div class="logo-wrapper">
                        <a href="index.html">
                            <img class="img-fluid main-logo" src="assets/images/logo/1.png" alt="logo">
                            <img class="img-fluid white-logo" src="assets/images/logo/1-white.png" alt="logo">
                        </a>
                    </div>
                    <div class="toggle-sidebar">
                        <i class="status_toggle middle sidebar-toggle" data-feather="align-center"></i>
                        <a href="index.html">
                            <img src="assets/images/logo/1.png" class="img-fluid" alt="">
                        </a>
                    </div>
                </div>

                <div
                    style="display:flex; justify-content:center; align-items:center; padding: 18px 0 14px 0; background: #fff; border-bottom: 2px solid #bdbdbd; box-shadow: 0 2px 8px 0 rgba(0,0,0,0.04); margin-bottom: 8px;">
                    <span style="
                    font-size:2rem;
                    font-weight:900;
                    letter-spacing:2.5px;
                    color: #222;
                    text-shadow: 0 2px 8px #e0e0e0;
                    padding: 0 36px;
                  ">
                        Quản lí hệ thống
                    </span>
                </div>
                <div class="nav-right col-6 pull-right right-header p-0">
                    <ul class="nav-menus">
                        <li>
                            <span class="header-search">
                                <i class="ri-search-line"></i>
                            </span>
                        </li>
                        <li class="onhover-dropdown">
                            <div class="notification-box">
                                <i class="ri-notification-line"></i>
                                <span class="badge rounded-pill badge-theme">4</span>
                            </div>
                            <ul class="notification-dropdown onhover-show-div">
                                <!-- ... -->
                            </ul>
                        </li>

                        <li>
                            <div class="mode">
                                <i class="ri-moon-line"></i>
                            </div>
                        </li>
                        <!-- CHỖ NÀY: Profile-nav đã chỉnh để lấy dữ liệu động -->
                        <li class="profile-nav onhover-dropdown pe-0 me-0">
                            <div class="media profile-media">
                                <img class="user-profile rounded-circle" src="assets/images/users/4.jpg" alt="">
                                <div class="user-name-hide media-body">
                                    <!-- Thay bằng ID để script gán giá trị -->
                                    <span id="user-name">Loading...</span>
                                    <p class="mb-0 font-roboto">
                                        <span id="user-role">…</span>
                                        <i class="middle ri-arrow-down-s-line"></i>
                                    </p>
                                </div>
                            </div>
                            <ul class="profile-dropdown onhover-show-div">
                                <li>
                                    <a href="profile-setting.html">
                                        <i data-feather="settings"></i>
                                        <span>Settings</span>
                                    </a>
                                </li>
                                <li>
                                    <a data-bs-toggle="modal" data-bs-target="#staticBackdrop"
                                        href="javascript:void(0)">
                                        <i data-feather="log-out"></i>
                                        <span>Log out</span>
                                    </a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <!-- Page Header End -->

        <!-- Modal Start -->
        <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
            <div class="modal-dialog  modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body">
                        <h5 class="modal-title" id="staticBackdropLabel">Logging Out</h5>
                        <p>Are you sure you want to log out?</p>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        <div class="button-box">
                            <button type="button" class="btn--no btn btn-outline-secondary"
                                data-bs-dismiss="modal">No</button>
                            <button type="button" onclick="location.href = '../back-end/login.html';"
                                class="btn--yes btn btn-primary">Yes</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal End -->

        <!-- component-loader js -->
        <script src="components/component-loader.js"></script>

        <!-- Script gọi API /api/me và hiển thị user info -->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                fetch('http://localhost:8080/api/me', {
                    method: 'GET',
                    mode: 'cors',               // bật CORS
                    credentials: 'include',     // gửi kèm JSESSIONID
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                    .then(res => {
                        if (!res.ok) throw new Error('Not authenticated');
                        return res.json();
                    })
                    .then(user => {
                        document.getElementById('user-name').textContent = user.name;
                        document.getElementById('user-role').textContent = user.role;
                    })
                    .catch(err => {
                        console.warn(err);
                        // Nếu chưa login, có thể redirect: 
                        // window.location.href = '/YourAppContext/login.html';
                        document.getElementById('user-name').textContent = '';
                        document.getElementById('user-role').textContent = '';
                    });
            });
        </script>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Test Provinces Fetch</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    ul { list-style: none; padding: 0; }
    li { margin: 0.5rem 0; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Danh sách Tỉnh/Thành phố</h1>
  <button id="btn-load">Tải provinces</button>
  <div id="status"></div>
  <ul id="prov-list"></ul>

  <script>
    document.getElementById('btn-load').addEventListener('click', () => {
      const status = document.getElementById('status');
      const listEl = document.getElementById('prov-list');
      status.textContent = 'Đang tải...';
      listEl.innerHTML = '';

      fetch('http://localhost:8080/provinces')
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          status.textContent = `Đã tải ${data.length} mục`;
          data.forEach(p => {
            const li = document.createElement('li');
            li.textContent = `${p.locationId} — ${p.locationName}`;
            listEl.appendChild(li);
          });
        })
        .catch(err => {
          status.innerHTML = `<span class="error">Lỗi: ${err.message}</span>`;
          console.error(err);
        });
    });
  </script>
</body>
</html>s

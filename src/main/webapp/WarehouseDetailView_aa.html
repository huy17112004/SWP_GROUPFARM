<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh sách Kho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background: #f8f9fa; }
        .search-bar { max-width: 350px; margin-bottom: 20px; float: right; }
        .table thead th { background: #0d6efd; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mb-4">Danh sách Kho</h1>
    <div class="d-flex justify-content-between align-items-center mb-2">
        <button id="btn-refresh" class="btn btn-primary">Tải danh sách</button>
        <input type="text" id="search-input" class="form-control search-bar" placeholder="Tìm theo tên kho...">
    </div>
    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Tên Kho</th>
            <th>Điện Thoại</th>
            <th>Địa Chỉ</th>
            <th>Quản Lý</th>
            <th>Nhân Viên</th>
        </tr>
        </thead>
        <tbody id="warehouse-table-body">
        <!-- Dữ liệu sẽ được load tại đây -->
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = 'http://localhost:8080/api/warehouses-detail';
    let warehouseList = [];

    async function loadList() {
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error('Lỗi khi tải dữ liệu');
            warehouseList = await res.json();
            renderTable(warehouseList);
        } catch (err) {
            console.error(err);
            alert('Không thể tải danh sách kho.');
        }
    }

    function renderTable(list) {
        const tbody = document.getElementById('warehouse-table-body');
        tbody.innerHTML = '';
        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Không có kho phù hợp!</td></tr>';
            return;
        }
        list.forEach(w => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${w.warehouseId}</td>
                <td>${w.warehouseName}</td>
                <td>${w.warehousePhone}</td>
                <td>${w.fullAddress}</td>
                <td>${w.managerName || ''}</td>
                <td>${w.staffName || ''}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Lọc theo tên kho (realtime)
    document.getElementById('search-input').addEventListener('input', function() {
        const searchText = this.value.trim().toLowerCase();
        if (!searchText) {
            renderTable(warehouseList);
            return;
        }
        const filtered = warehouseList.filter(w =>
            (w.warehouseName || '').toLowerCase().includes(searchText)
        );
        renderTable(filtered);
    });

    document.getElementById('btn-refresh').addEventListener('click', loadList);

    loadList();
</script>
</body>
</html>

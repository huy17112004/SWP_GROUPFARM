<!-- … phần đầu template của bạn … -->

<div class="table-responsive">
    <table class="table all-package theme-table table-product" id="table_id">
        <thead>
        <tr>
            <th>Product Image</th>
            <th>Product Name</th>
            <th>Category</th>
            <th>Current Qty</th>
            <th>Price</th>
            <th>Expired Date</th>
            <th>Import Date</th>
        </tr>
        </thead>
        <tbody>
        <!-- Xóa hết các <tr> mẫu cũ đi, để trống -->
        </tbody>
    </table>
</div>

<!-- … phần cuối template của bạn … -->

<!-- Chèn đoạn script ngay trước </body> -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const tbody = document.querySelector('#table_id tbody');

        fetch('/api/products-list')
            .then(res => res.ok ? res.json() : Promise.reject(res.status))
            .then(data => {
                const list = Array.isArray(data) ? data : [data];
                list.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
            <td><img src="${item.imageUrl}" class="img-fluid" alt=""></td>
            <td>${item.name}</td>
            <td>${item.categoryName}</td>
            <td>${item.quantity}</td>
            <td class="td-price">${item.retailPrice.toLocaleString()}₫</td>
            <td>${item.expiredDate}</td>
            <td>${item.importDate}</td>
          `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error('Lỗi khi tải sản phẩm:', err);
                tbody.innerHTML = '<tr><td colspan="7" style="color:red">Không thể tải dữ liệu</td></tr>';
            });
    });
</script>

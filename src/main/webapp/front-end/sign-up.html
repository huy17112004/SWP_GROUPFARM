<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản - Fastkart</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e3f0ff 100%);
            margin: 0;
            padding: 0;
        }
        /* Header styles */
        .header {
            width: 100%;
            background: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-inner {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 74px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #f44336;
            letter-spacing: 1px;
            margin-right: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo i {
            color: #388e3c;
            font-size: 28px;
        }
        .all-categories-btn {
            background: #4caf7a;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px 26px;
            font-size: 16px;
            font-weight: 500;
            margin-right: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(76,175,122,0.08);
            transition: background 0.2s, box-shadow 0.2s;
        }
        .all-categories-btn:hover {
            background: #388e3c;
            box-shadow: 0 4px 16px rgba(76,175,122,0.13);
        }
        .header-menu {
            display: flex;
            gap: 28px;
        }
        .header-menu a {
            text-decoration: none;
            color: #222;
            font-weight: 500;
            font-size: 16px;
            position: relative;
            padding: 4px 0;
            transition: color 0.2s;
        }
        .header-menu a:hover {
            color: #f44336;
        }
        .header-menu .new {
            color: #fff;
            background: #f44336;
            border-radius: 8px;
            font-size: 12px;
            padding: 2px 6px;
            margin-left: 4px;
            vertical-align: middle;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .deal-btn {
            background: #e8f5e9;
            color: #388e3c;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(56,142,60,0.07);
            transition: background 0.2s, box-shadow 0.2s;
        }
        .deal-btn:hover {
            background: #c8e6c9;
            box-shadow: 0 4px 16px rgba(56,142,60,0.13);
        }
        /* Main layout */
        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 74px);
            background: url('https://www.transparenttextures.com/patterns/cubes.png') repeat;
        }
        .left-illustration {
            flex: 1.2;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            min-width: 0;
            padding-right: 30px;
        }
        /*.left-illustration img {*/
        /*    width: 90%;*/
        /*    max-width: 500px;*/
        /*    min-width: 260px;*/
        /*    filter: drop-shadow(0 8px 32px rgba(76,175,122,0.10));*/
        /*}*/
        .right-form {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-width: 0;
            padding-left: 30px;

        }
        .form-box {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(244,67,54,0.10);
            padding: 48px 40px 36px 40px;
            width: 100%;
            max-width: 430px;
            margin: 48px 0;
            animation: fadeInUp 0.7s cubic-bezier(.39,.575,.565,1) both;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: none; }
        }
        .form-box h2 {
            margin: 0 0 8px 0;
            font-size: 26px;
            font-weight: 800;
            color: #222;
        }
        .form-box p {
            margin: 0 0 24px 0;
            color: #555;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #bdbdbd;
            font-size: 17px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 10px 12px 40px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            background: #fafbfc;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .form-group input#username {
            max-width: 380px; /* Giảm chiều rộng của trường Tên Đăng Nhập */
        }
        .form-group input#email {
            max-width: 380px; /* Giảm chiều rộng của trường Email */
        }
        .form-group input#password {
            max-width: 380px; /* Giảm chiều rộng của trường PassWord */
        }

        .form-group input:focus {
            border: 1.5px solid #f44336;
            outline: none;
            box-shadow: 0 2px 8px rgba(244,67,54,0.08);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .checkbox-group input[type="checkbox"] {
            accent-color: #f44336;
            width: 18px;
            height: 18px;
            border-radius: 5px;
            margin-right: 10px;
        }
        .checkbox-group label {
            font-weight: 400;
            color: #555;
            font-size: 14px;
        }
        .checkbox-group a {
            color: #388e3c;
            text-decoration: none;
        }
        .register-btn {
            background: linear-gradient(90deg, #f44336 60%, #ff7961 100%);
            color: #fff;
            padding: 15px 0;
            border: none;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(244,67,54,0.10);
            transition: background 0.2s, box-shadow 0.2s;
        }
        .register-btn:hover {
            background: linear-gradient(90deg, #e53935 60%, #ff7961 100%);
            box-shadow: 0 4px 16px rgba(244,67,54,0.16);
        }
        .or {
            text-align: center;
            margin: 20px 0 16px 0;
            color: #aaa;
            font-size: 14px;
            position: relative;
        }
        .or:before, .or:after {
            content: '';
            display: inline-block;
            width: 40%;
            height: 1px;
            background: #eee;
            vertical-align: middle;
            margin: 0 8px;
        }
        .social-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            justify-content: center; /* Căn giữa nội dung trong nút */
            width: 100%; /* Đảm bảo nút chiếm toàn bộ chiều rộng của container */
            text-align: center; /* Căn giữa văn bản */
        }
        .social-btn.google {
            background: #fff;
            color: #222;
            border: 1.5px solid #e0e0e0;
        }
        .social-btn.google:hover {
            background: #f5f5f5;
            box-shadow: 0 2px 8px rgba(66,133,244,0.10);
            border-color: #4285f4;
        }
        .social-btn.facebook {
            background: #1877f2;
            color: #fff;
            border: none;
            display: flex;

        }
        .social-btn.facebook:hover {
            background: #145db2;
            box-shadow: 0 2px 8px rgba(24,119,242,0.10);
            padding-left: 50px;
        }
        .social-btn img, .social-btn i {
            width: 22px;
            height: 22px;
            font-size: 22px;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 15px;
            color: #555;
        }
        .login-link a {
            color: #388e3c;
            text-decoration: none;
            font-weight: 600;
        }
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            .left-illustration {
                display: none;
            }
            .form-box {
                margin: 30px 0;
            }
        }
        @media (max-width: 600px) {
            .header-inner {
                flex-direction: column;
                height: auto;
                padding: 10px 0;
            }
            .main-container {
                flex-direction: column;
            }
            .form-box {
                padding: 24px 10px;
            }
        }
    </style>
</head>
<body>
<!-- Header -->
<div class="header">
    <div class="header-inner">
        <div class="header-left">
            <span class="logo"><i class="fa-solid fa-basket-shopping"></i> Fastkart</span>
            <button class="all-categories-btn">
                <span style="font-size:20px;">&#9776;</span> All Categories
            </button>
            <nav class="header-menu">
                <a href="#">Home</a>
                <a href="#">Shop</a>
                <a href="#">Product</a>
                <a href="#">Mega Menu</a>
                <a href="#">Blog</a>
                <a href="#">Pages <span class="new">New</span></a>
                <a href="#">Seller</a>
            </nav>
        </div>
        <div class="header-right">
            <button class="deal-btn">
                <span style="font-size:18px;">&#9889;</span> Deal Today
            </button>
        </div>
    </div>
</div>
<!-- Main Content -->
<div class="main-container">
    <!-- Left Illustration -->
<!--    <div class="left-illustration">-->
<!--        <img src="../images/#" alt="Illustration">-->
<!--    </div>-->
    <!-- Right Form -->
    <div class="right-form">
        <div class="form-box">
            <h2>Chào mừng đến với Fastkart</h2>
            <p>Tạo tài khoản mới</p>
            <form>
                <div class="form-group">
                    <i class="fa fa-user"></i>
                    <input type="text" id="username" placeholder="Tên đăng nhập">
                </div>
                <div class="form-group">
                    <i class="fa fa-envelope"></i>
                    <input type="email" id="email" placeholder="Địa chỉ Email">
                </div>
                <div class="form-group">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="password" placeholder="Mật khẩu">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="agree">
                    <label for="agree">Tôi đồng ý với <a href="#">Điều khoản</a> và <a href="#">Chính sách bảo mật</a></label>
                </div>
                <button class="register-btn" type="submit">Đăng ký</button>
                <div class="or">HOẶC</div>
                <button type="button" class="social-btn google">
                    <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google"> Đăng ký bằng Google
                </button>
                <button type="button" class="social-btn facebook">
                    <i class="fa-brands fa-facebook-f"></i> Đăng ký bằng Facebook
                </button>
                <div class="login-link">
                    Đã có tài khoản? <a href="#">Đăng nhập</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('signUpForm');
            const alertContainer = document.createElement('div');
            form.prepend(alertContainer);

            form.addEventListener('submit', async e => {
                e.preventDefault();
                alertContainer.innerHTML = '';

                // 1. Lấy giá trị
                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirm = document.getElementById('confirmPassword').value;
                const baseUrl = document.getElementById('verificationBaseUrl').value;
                const agreeCheckbox = document.getElementById('flexCheckDefault');

                // 2. Validate cơ bản
                if (!username || !email || !password || !confirm) {
                    showAlert('Vui lòng điền đầy đủ thông tin.', 'danger');
                    return;
                }
                if (password !== confirm) {
                    showAlert('Xác nhận mật khẩu không khớp.', 'danger');
                    return;
                }
                // 2.1. Bắt buộc phải tích đồng ý
                if (!agreeCheckbox.checked) {
                    showAlert('Bạn phải đồng ý với Điều khoản và Chính sách bảo mật để đăng ký.', 'danger');
                    return;
                }

                // 3. Gửi JSON đến servlet /signup
                const payload = { username, email, password, confirmPassword: confirm, verificationBaseUrl: baseUrl };
                try {
                    const resp = await fetch('http://localhost:8080/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await resp.json();

                    if (resp.ok) {
                        showAlert(data.message, 'success');
                    } else {
                        showAlert(data.error || 'Đăng ký thất bại.', 'danger');
                    }
                } catch (err) {
                    console.error(err);
                    showAlert('Không thể kết nối đến server.', 'danger');
                }
            });

            function showAlert(msg, type = 'info') {
                alertContainer.innerHTML = ''; // Luôn clear alert trước khi hiển thị
                const div = document.createElement('div');
                div.className = `alert alert-${type}`;
                div.textContent = msg;
                alertContainer.append(div);
            }
        });

    </script>
    <script>
        // Load header/footer và logic giống index-7.html
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                feather.replace();

                // Đặt script xử lý đăng nhập/đăng xuất ở đây!
                fetch('/api/auth/user')
                    .then(res => res.json())
                    .then(data => {
                        if (data.loggedIn) {
                            document.getElementById('user-not-logged-in').classList.add('d-none');
                            document.getElementById('user-logged-in').classList.remove('d-none');
                            // Đổi icon thành filled
                            document.getElementById('user-icon-area').innerHTML = '<i data-feather="user-check"></i>';
                            // Cập nhật tên người dùng
                            document.getElementById('user-greeting').textContent = `Xin chào,`;
                            document.getElementById('user-account-label').textContent = `${data.name}`;
                        } else {
                            document.getElementById('user-not-logged-in').classList.remove('d-none');
                            document.getElementById('user-logged-in').classList.add('d-none');
                            // Đổi lại icon outline
                            document.getElementById('user-icon-area').innerHTML = '<i data-feather="user"></i>';
                            // Cập nhật lại về mặc định
                            document.getElementById('user-greeting').textContent = "Gia nhập";
                            document.getElementById('user-account-label').textContent = "với chúng tôi";
                            feather.replace();
                        }
                    });
                document.addEventListener('click', function(e) {
                    if (e.target && e.target.id === 'logout-btn') {
                        e.preventDefault();
                        fetch('/logout', { method: 'GET' })
                            .then(() => window.location.href = 'login.html');
                    }
                });

                // Thêm logic search cho thanh search trong header
                (function() {
                    // Tìm input và button trong header
                    const input = document.querySelector('.middle-box input[type="search"]');
                    const btn = document.getElementById('button-addon2');
                    if (!input || !btn) return;
                    function doSearch() {
                        const value = input.value.trim();
                        if (value) {
                            window.location.href = `shop-category.html?name=${encodeURIComponent(value)}`;
                        }
                    }
                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') doSearch();
                    });
                    btn.addEventListener('click', doSearch);
                })();
            });
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
                feather.replace();
            });
    </script>
